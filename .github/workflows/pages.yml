name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/configure-pages@v6
      - name: Prepare the static frontend
        run: |
          mkdir -p "$RUNNER_TEMP/frontend-pages"
          rsync -a --exclude 'app/api/revalidate' frontend/ "$RUNNER_TEMP/frontend-pages/"
      - name: Install dependencies
        working-directory: ${{ runner.temp }}/frontend-pages
        run: npm ci
      - name: Build static site
        working-directory: ${{ runner.temp }}/frontend-pages
        env:
          STATIC_EXPORT: "true"
          SITE_URL: https://ktg1.github.io/wordpress-back-end-nextjs-site
          WORDPRESS_PUBLIC_URL: https://github.com/KTG1/wordpress-back-end-nextjs-site
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/frontend-pages/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
